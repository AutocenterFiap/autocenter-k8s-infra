apiVersion: v1
kind: ServiceAccount
metadata:
  name: datadog-agent
  namespace: autocenter
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: datadog-agent
rules:
  - apiGroups: [""]
    resources: ["nodes/metrics", "nodes/spec", "nodes/stats", "nodes/proxy", "nodes/pods", "nodes/healthz", "pods", "events", "namespaces", "endpoints", "services"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics", "/metrics/slis"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: datadog-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: datadog-agent
subjects:
  - kind: ServiceAccount
    name: datadog-agent
    namespace: autocenter
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: datadog
  namespace: autocenter
spec:
  selector:
    matchLabels:
      app: datadog
  template:
    metadata:
      labels:
        app: datadog
    spec:
      serviceAccountName: datadog-agent
      containers:
        - name: agent
          image: gcr.io/datadoghq/agent:7.83.1
          env:
            - name: DD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: datadog-secret
                  key: api-key
            - name: DD_SITE
              value: datadoghq.com
            - name: DD_CLUSTER_NAME
              value: kind-autocenter
            - name: DD_KUBERNETES_KUBELET_NODENAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: DD_KUBELET_TLS_VERIFY
              value: "false"
            - name: DD_LOGS_ENABLED
              value: "true"
            - name: DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL
              value: "true"
            - name: DD_APM_ENABLED
              value: "false"
            - name: DD_PROCESS_AGENT_ENABLED
              value: "false"
            - name: DD_CONTAINER_EXCLUDE
              value: "image:gcr.io/datadoghq/agent"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - {name: dockersocket, mountPath: /var/run/docker.sock, readOnly: true}
            - {name: procdir, mountPath: /host/proc, readOnly: true}
            - {name: cgroups, mountPath: /host/sys/fs/cgroup, readOnly: true}
            - {name: logpodpath, mountPath: /var/log/pods, readOnly: true}
            - {name: logcontainerpath, mountPath: /var/log/containers, readOnly: true}
      volumes:
        - {name: dockersocket, hostPath: {path: /var/run/docker.sock}}
        - {name: procdir, hostPath: {path: /proc}}
        - {name: cgroups, hostPath: {path: /sys/fs/cgroup}}
        - {name: logpodpath, hostPath: {path: /var/log/pods}}
        - {name: logcontainerpath, hostPath: {path: /var/log/containers}}
