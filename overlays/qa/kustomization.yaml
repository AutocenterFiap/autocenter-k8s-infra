apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../k8s
patches:
  - target:
      kind: StatefulSet
      name: kafka
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: kafka
      spec:
        template:
          spec:
            containers:
              - name: kafka
                env:
                  - name: KAFKA_ADVERTISED_LISTENERS
                    value: "PLAINTEXT://kafka.autocenter.svc.cluster.local:9092,EXTERNO://localhost:19094"
