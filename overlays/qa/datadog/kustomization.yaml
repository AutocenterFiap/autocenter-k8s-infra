apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../k8s/datadog
patches:
  - target:
      kind: DaemonSet
      name: datadog
    patch: |-
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: datadog
      spec:
        template:
          spec:
            containers:
              - name: agent
                env:
                  - name: DD_CLUSTER_NAME
                    value: kind-autocenter-qa
                  - name: DD_ENV
                    value: qa
